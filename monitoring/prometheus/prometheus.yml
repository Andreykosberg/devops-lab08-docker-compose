global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Самомониторинг Prometheus
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Доп.задание: сбор нативных метрик Flask-приложения (view_count и др.)
  # Стек flask-redis — отдельный docker compose проект (своя сеть), поэтому
  # обращаемся не по имени сервиса, а по адресу хоста и опубликованному порту.
  - job_name: "flask-redis-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["10.0.2.15:8000"]

  # Blackbox exporter проверяет доступность HTTP(S)-целей
  - job_name: "blackbox-http"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://10.0.2.15:8000      # собственное Flask-приложение (основная цель)
          - https://github.com          # внешний публичный сайт для демонстрации probe
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
